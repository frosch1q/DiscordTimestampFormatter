<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Discord Timestamp Formatter" />
    <meta property="og:description" content="Discord Timestamp Formatter" />
    <meta property="og:image" content="https://raw.githubusercontent.com/Mori-Takahashi/DiscordTimestampFormatter/refs/heads/3-responsive-for-mobile/scr/favicon.ico" />
    <meta property="og:url" content="dcformetter.lyonelberzen.dev" />
    <meta name="theme-color" content="#333" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="scr/favicon.ico" type="image/x-icon">
    <title>Discord Timestamp Formatter</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>
</head>
<body>
<div class="container py-5 app-shell">
    <header class="text-center mb-4">
        <h1 class="display-5 fw-semibold mb-2">Discord Timestamp Formatter</h1>
    </header>

    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <section class="panel">
                <div class="panel__header">
                    <div>
                        <p class="eyebrow mb-1">Input</p>
                        <h2 class="h4 mb-0">Date & format</h2>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="dateInput">Date and time</label>
                    <input class="form-control form-control-lg" type="datetime-local" id="dateInput" autocomplete="off">
                </div>

                <div class="mb-4">
                    <label class="form-label" for="formatOption">Discord display</label>
                    <select class="form-select form-select-lg" id="formatOption">
                        <option value="Default">Default</option>
                        <option value="Short Time">Short Time</option>
                        <option value="Long Time">Long Time</option>
                        <option value="Short Date">Short Date</option>
                        <option value="Long Date">Long Date</option>
                        <option value="Short Date/Time">Short Date/Time</option>
                        <option value="Long Date/Time">Long Date/Time</option>
                        <option value="Relative Time">Relative Time</option>
                    </select>
                </div>

                <div class="d-flex flex-wrap gap-3">
                    <button type="button" class="btn btn-primary btn-lg px-4" data-action="generate">Generate timestamp</button>
                    <button type="button" class="btn btn-outline-light btn-lg px-4" id="copyButton" disabled>Copy</button>
                </div>
            </section>
        </div>

        <div class="col-12 col-lg-6">
            <section class="panel panel--ghost h-100">
                <div class="panel__header">
                    <div>
                        <p class="eyebrow mb-1">Output</p>
                        <h2 class="h4 mb-0">Preview</h2>
                    </div>
                    <span class="pill">Local</span>
                </div>
                <p id="preview" class="preview-text mb-4">Pick a date to see the preview.</p>

                <div class="result-block">
                    <span class="eyebrow text-uppercase">Discord tag</span>
                    <code id="result" class="result-code">—</code>
                </div>
            </section>
        </div>
    </div>

    <section class="panel mt-4">
        <div class="panel__header flex-wrap">
            <div>
                <p class="eyebrow mb-1">You can report errors here</p>
                <h3 class="h5 mb-0">Bug reports & feedback</h3>
            </div>
            <div class="d-flex gap-2">
                <a href="https://github.com/Mori-Takahashi/DiscordTimestampFormatter" target="_blank" rel="noreferrer" class="btn btn-outline-light">GitHub</a>
                <a href="https://github.com/Mori-Takahashi/DiscordTimestampFormatter/issues" target="_blank" rel="noreferrer" class="btn btn-warning">Open an issue</a>
            </div>
        </div>
        <p class="text-muted mb-0">Describe the steps to reproduce the problem and your timezone to help us debug quickly.</p>
    </section>

    <div id="toast"></div>
</div>
</body>
</html>
